name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Run Dagster ingestion
        run: docker compose run --rm dagster

      - name: Run pytest
        run: docker compose run --rm dbt pytest

      - name: Run dbt models and tests
        run: docker compose run --rm dbt
